# RetroFire override of the libretro "Amazon Fire TV Remote" profile (copied over it by rf assets).
# RetroArch 1.22 (input/drivers/android_input.c) stores the remote's centre key DPAD_CENTER (23)
# as ENTER (66), so a bind on 23 never fires: the official profile leaves OK dead.
#
#   centre  = OK in menus / button B (jump, fire) in games
#   Back    = back in menus / button A
#   Menu ≡  = Start          Play/Pause = RetroArch menu
#   Rewind  = Select (insert coin in arcade games)   Fast forward = R
# Home, volume and the app buttons stay with Fire OS.

input_driver = "android"
input_device = "Amazon Fire TV Remote"
input_vendor_id = "369"
input_product_id = "1057"
input_device_display_name = "Fire TV Remote"

input_up_btn = "19"
input_down_btn = "20"
input_left_btn = "21"
input_right_btn = "22"
input_b_btn = "66"
input_a_btn = "4"
input_start_btn = "82"
input_select_btn = "89"
input_r_btn = "90"
input_menu_toggle_btn = "85"

input_up_btn_label = "D-Pad Up"
input_down_btn_label = "D-Pad Down"
input_left_btn_label = "D-Pad Left"
input_right_btn_label = "D-Pad Right"
input_b_btn_label = "Select (centre)"
input_a_btn_label = "Back"
input_start_btn_label = "Menu"
input_select_btn_label = "Rewind"
input_r_btn_label = "Fast Forward"
input_menu_toggle_btn_label = "Play/Pause"
